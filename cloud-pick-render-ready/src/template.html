<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a29">
<meta name="description" content="세 구름 중 하나를 선택하세요. 혼자면 코인 획득, 겹치면 0코인. 최대 4인 랜덤 매칭 게임.">
<title>CLOUD PICK · AFTER DARK</title>
<style>/*STYLE*/</style>
</head>
<body data-screen="home">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div class="app-shell">
<header class="topbar">
 <a class="brand" href="#" data-action="home" aria-label="Cloud Pick 처음으로">
  <span class="brand-mark"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M30 5A17 17 0 1 0 35 34A18 18 0 0 1 30 5" fill="#dab583"/><path d="M34 6 35 10 39 11 35 12 34 16 33 12 29 11 33 10Z" fill="#dab583"/></svg></span>
  <span>CLOUD PICK<small>AFTER DARK</small></span>
 </a>
 <div id="screenLocation" class="screen-location"></div>
 <nav class="top-actions" aria-label="게임 메뉴"><span id="connectionPill" class="connection-pill" hidden></span><button class="menu-trigger" data-action="menu" aria-label="메뉴 열기" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>메뉴</span></button></nav>
</header>
<main id="main" tabindex="-1">
<div class="game-layout">
 <section class="play-column" aria-label="구름 게임 보드">
  <div id="roster" class="roster" aria-label="플레이어별 누적 코인"></div>
  <div id="networkNotice" class="network-notice" role="status" hidden></div>
  <div class="stage" id="stage">
   <canvas id="gameCanvas" role="img" aria-label="3 × 3 구름 보드. 번호가 표시된 세 구름을 고를 수 있습니다. 아래 버튼 또는 숫자 키로도 조작할 수 있습니다."></canvas>
   <div class="stage-top">
    <div class="round-chip" id="roundChip"></div>
    <div class="timer" id="timer" role="timer" aria-live="off"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="timer-track" cx="32" cy="32" r="28"/><circle class="timer-progress" id="timerProgress" cx="32" cy="32" r="28"/></svg><b id="timerValue">☾</b><span id="timerLabel">연습</span></div>
    <div class="stage-badge" id="stageBadge"></div>
   </div>
   <div class="phase-banner" id="phaseBanner" aria-live="polite"></div>
   <div class="stage-caption" id="stageCaption"></div>
  </div>
  <div class="choice-bar" id="choiceBar" tabindex="-1"></div>
  <div class="board-footer"><span>내 선택은 공개 전까지 비밀.</span><span class="keyboard-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 선택 <span>·</span> <kbd>Enter</kbd> 확정</span></div>
 </section>
 <aside class="sidebar" id="sidebar" aria-label="현재 단계 안내"></aside>
</div>
<section class="finish-overlay" id="finishOverlay" aria-label="게임 결과" hidden></section>

</main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialogTitle"><button class="dialog-close" data-action="closeDialog" aria-label="닫기">×</button><div id="dialogBody"></div></dialog>
<script>/*RULES*/</script>
<script>/*APP*/</script>
</body>
</html>
