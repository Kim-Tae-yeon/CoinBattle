<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#195b4c"><title>IDOL LONG RUN · Motion R&D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f3}iframe{display:block;width:100%;height:100%;border:0;background:#eef1f3}</style></head><body><iframe id="game" src="./index.html" title="이번 생은 아이돌"></iframe><script>const frame=document.getElementById('game');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d||d.getElementById('rnd-motion-style'))return;const style=d.createElement('style');style.id='rnd-motion-style';style.textContent=`:root{--rnd-spring:cubic-bezier(.2,.9,.25,1.18)}html{scroll-behavior:smooth}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}.maincta,.choice,.route,.topbtn,.opt button{transition:transform .15s var(--rnd-spring),box-shadow .18s ease,border-color .18s ease,filter .18s ease}.maincta:active,.choice:active,.route:active,.opt button:active{transform:scale(.975);filter:brightness(.98)}.choice.rec{animation:rndPulse 2.2s ease-in-out infinite}.badge{animation:rndBadge .35s var(--rnd-spring) both}.arrow{animation:rndArrow 1.35s ease-in-out infinite}.goal,.card,.choice,details{animation:rndCardIn .28s both}.choiceList .choice:nth-child(2){animation-delay:.035s}.choiceList .choice:nth-child(3){animation-delay:.07s}.bar i{transition:width .48s cubic-bezier(.2,.8,.2,1)}.sheet:not(.hide){animation:rndFade .16s ease both}.sheet:not(.hide) .modal{animation:rndSheet .3s var(--rnd-spring) both}.rnd-fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden;max-width:430px;margin:auto}.rnd-p{position:absolute;width:7px;height:7px;border-radius:50%;background:#2f7d67;opacity:0;box-shadow:0 0 0 2px #ffffff88;animation:rndFly .62s ease-out forwards}.rnd-p.pink{background:#ef7199}.rnd-ripple{position:fixed;width:72px;height:72px;border-radius:50%;background:#195b4c1f;pointer-events:none;z-index:79;transform:translate(-50%,-50%) scale(0);animation:rndRipple .45s ease-out forwards}.rnd-toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,14px);background:#173f35;color:white;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 10px 28px #11253633;opacity:0;animation:rndToast .9s ease forwards}.rnd-flash{position:fixed;inset:0;z-index:75;pointer-events:none;background:#ef71990d;animation:rndFlash .28s ease-out forwards}@keyframes rndCardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes rndBadge{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes rndArrow{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}@keyframes rndPulse{0%,100%{box-shadow:0 5px 18px #ef719916}50%{box-shadow:0 10px 28px #ef719933}}@keyframes rndFade{from{opacity:0}to{opacity:1}}@keyframes rndSheet{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes rndRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}@keyframes rndFly{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}@keyframes rndToast{0%{opacity:0;transform:translate(-50%,14px)}18%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}@keyframes rndFlash{from{opacity:1}to{opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}`;d.head.appendChild(style);const fx=d.createElement('div');fx.className='rnd-fx';d.body.appendChild(fx);const vib=p=>{try{w.navigator.vibrate&&w.navigator.vibrate(p)}catch(e){}};const ripple=(x,y)=>{const r=d.createElement('i');r.className='rnd-ripple';r.style.left=x+'px';r.style.top=y+'px';d.body.appendChild(r);setTimeout(()=>r.remove(),500)};const burst=(x,y,pink=false,count=8)=>{for(let i=0;i<count;i++){const p=d.createElement('i');p.className='rnd-p'+(pink?' pink':'');p.style.left=x+'px';p.style.top=y+'px';const a=Math.PI*2/count*i+(Math.random()-.5)*.35,dist=28+Math.random()*34;p.style.setProperty('--dx',Math.cos(a)*dist+'px');p.style.setProperty('--dy',Math.sin(a)*dist+'px');fx.appendChild(p);setTimeout(()=>p.remove(),700)}};const toast=text=>{d.querySelectorAll('.rnd-toast').forEach(n=>n.remove());const t=d.createElement('div');t.className='rnd-toast';t.textContent=text;d.body.appendChild(t);setTimeout(()=>t.remove(),950)};const flash=()=>{const f=d.createElement('i');f.className='rnd-flash';d.body.appendChild(f);setTimeout(()=>f.remove(),320)};d.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))return;ripple(e.clientX,e.clientY);vib(7)},{passive:true});d.addEventListener('click',e=>{const a=e.target.closest('.choice');if(a){const r=a.getBoundingClientRect(),pink=a.classList.contains('rec');burst(r.right-32,r.top+r.height/2,pink,pink?11:7);toast(pink?'추천 행동 선택 ✓':'행동 선택 ✓');flash();vib([9,22,11]);return}const route=e.target.closest('.route');if(route){const r=route.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,false,12);toast('커리어 시작!');vib([12,18,12]);return}if(e.target.closest('.opt button')){const r=e.target.closest('button').getBoundingClientRect();burst(r.right-28,r.top+r.height/2,true,9);toast('선택 반영 ✓');vib(12)}});d.addEventListener('toggle',e=>{if(e.target.matches('details')&&e.target.open)vib(5)},true)});</script></body></html>
